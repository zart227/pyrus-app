# Конфигурация Nginx на хосте для доступа к приложению через /pyrus
# Этот файл нужно скопировать в /etc/nginx/sites-available/pyrus
# Команда: sudo cp nginx-host.conf /etc/nginx/sites-available/pyrus

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # Замените на ваш домен, если нужно

    # Редирект с корня на приложение
    location = / {
        return 301 /pyrus/;
    }

    # Основное приложение доступно по пути /pyrus
    location /pyrus/ {
        proxy_pass http://localhost:8082/;
        proxy_http_version 1.1;
        
        # Важные заголовки для корректной работы приложения
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /pyrus;
        
        # WebSocket поддержка (на случай будущих обновлений)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Отключаем буферизацию для лучшей производительности
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Редирект с /pyrus на /pyrus/ (важно для SPA)
    location = /pyrus {
        return 301 /pyrus/;
    }

    # Можно добавить другие location блоки для других приложений
    # location /other-app/ {
    #     proxy_pass http://localhost:8083/;
    #     ...
    # }
}

